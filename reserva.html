<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reserva.html">Servicios</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Formulario de Reserva</h2>
            <form id="formulario-reserva" action="#" method="post">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="fecha">Fecha de Reserva:</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="personas">Número de Personas:</label>
                <input type="number" id="personas" name="personas" min="1" required>

                <button type="submit">Reservar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Hospedaje Bamboo. Todos los derechos reservados.</p>
    </footer>
    <script src="reserva.js" defer></script>
</body>
</html>
